[package]
name = "kmod-blacklist"
version = "0.1.0"
edition = "2021"
description = "Minimal GUI to manage /etc/modprobe.d kernel module blacklists"
license = "MIT"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "advanced"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
