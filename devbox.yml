---
- name: configure devbox environment
  hosts: localhost
  tasks:
    - name: create user filesystem tree
      import_tasks: tasks/user-filesystem.yml

    - name: deploy base development tools
      import_tasks: tasks/base-devel.yml

    - name: deploy zsh
      import_tasks: tasks/zsh.yml

    - name: deploy vim
      import_tasks: tasks/vim.yml

    - name: deploy tmux
      import_tasks: tasks/tmux.yml

    - name: deploy fedora utilities
      import_tasks: tasks/fedora.yml

    - name: deploy claude ai
      import_tasks: tasks/claude.yml
